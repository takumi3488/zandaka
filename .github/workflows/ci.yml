name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt:check

      - name: Check types and lint
        run: bun check

      - name: Test API
        run: bun run test:api

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test browser flows
        run: bun run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Validate production deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          missing=()
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN MASTER_KEY OPENROUTER_API_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            printf 'Missing required production secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          export LC_ALL=C
          if ((${#MASTER_KEY} < 32)); then
            printf 'MASTER_KEY must be at least 32 UTF-8 bytes.\n' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy production with Alchemy
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run deploy --stage production --yes --no-input
  automerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: test
    if: ${{ needs.test.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge labeled Renovate updates
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge"
